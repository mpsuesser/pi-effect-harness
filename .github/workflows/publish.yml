name: Publish

on:
    release:
        types: [published]

jobs:
    publish-npm:
        name: Publish to npm
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - run: bun install --frozen-lockfile

            - name: Test
              run: bun run test

            - name: Typecheck
              run: bun run typecheck

            - name: Build publishable tarball
              working-directory: harnesses/effect
              run: bun run build:publishable

            - name: Configure npm auth
              run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

            - name: Publish
              working-directory: harnesses/effect/dist
              run: bun publish --access public
